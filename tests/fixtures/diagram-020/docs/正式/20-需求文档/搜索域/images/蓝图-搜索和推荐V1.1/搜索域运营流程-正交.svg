<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 880" width="1410" height="880" role="img" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>搜索域 运营视角流程（正交连线版）</title>
  <desc>运营经云Mall管理后台配置暗纹词，经搜索管理后台配置搜索热词并进入运营后台做黑名单/白名单/排序管理；连线均为水平垂直正交路径。</desc>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>
  <rect id="bg-white" x="0" y="0" width="100%" height="100%" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-width="1.5">
    <!-- 顶部：运营 → 云Mall管理后台 / 搜索管理后台 -->
    <polyline points="720,60 720,110 200,110 200,160" marker-end="url(#arw)"/>
    <polyline points="720,110 790,110 790,160" marker-end="url(#arw)"/>
    <!-- 搜索管理后台 → 搜索热词配置页面 / 运营后台 -->
    <polyline points="790,200 790,230 620,230 620,250" marker-end="url(#arw)"/>
    <polyline points="790,230 1100,230 1100,250" marker-end="url(#arw)"/>

    <!-- 暗纹词流 -->
    <line x1="200" y1="200" x2="200" y2="250" marker-end="url(#arw)"/>
    <line x1="200" y1="290" x2="200" y2="342" marker-end="url(#arw)"/>
    <line x1="200" y1="398" x2="200" y2="435" marker-end="url(#arw)"/>
    <polyline points="110,490 85,490 85,580" marker-end="url(#arw)"/>
    <line x1="200" y1="545" x2="200" y2="580" marker-end="url(#arw)"/>
    <polyline points="30,600 20,600 20,370 120,370" marker-end="url(#arw)"/>
    <line x1="200" y1="620" x2="200" y2="670" marker-end="url(#arw)"/>
    <line x1="115" y1="720" x2="115" y2="810" marker-end="url(#arw)"/>
    <line x1="285" y1="720" x2="285" y2="810" marker-end="url(#arw)"/>

    <!-- 搜索热词流 -->
    <line x1="620" y1="290" x2="620" y2="342" marker-end="url(#arw)"/>
    <line x1="620" y1="398" x2="620" y2="435" marker-end="url(#arw)"/>
    <polyline points="530,490 505,490 505,580" marker-end="url(#arw)"/>
    <line x1="620" y1="545" x2="620" y2="580" marker-end="url(#arw)"/>
    <polyline points="450,600 440,600 440,370 540,370" marker-end="url(#arw)"/>
    <line x1="620" y1="620" x2="620" y2="670" marker-end="url(#arw)"/>
    <line x1="535" y1="720" x2="535" y2="810" marker-end="url(#arw)"/>
    <line x1="705" y1="720" x2="705" y2="810" marker-end="url(#arw)"/>

    <!-- 运营后台三分支 -->
    <polyline points="1100,290 1100,350" marker-end="url(#arw)"/>
    <polyline points="1100,320 900,320 900,350" marker-end="url(#arw)"/>
    <polyline points="1100,320 1300,320 1300,350" marker-end="url(#arw)"/>
    <line x1="900" y1="390" x2="900" y2="440" marker-end="url(#arw)"/>
    <line x1="900" y1="480" x2="900" y2="530" marker-end="url(#arw)"/>
    <line x1="900" y1="570" x2="900" y2="620" marker-end="url(#arw)"/>
    <line x1="900" y1="660" x2="900" y2="710" marker-end="url(#arw)"/>
    <line x1="1100" y1="390" x2="1100" y2="440" marker-end="url(#arw)"/>
    <line x1="1100" y1="480" x2="1100" y2="530" marker-end="url(#arw)"/>
    <line x1="1100" y1="570" x2="1100" y2="620" marker-end="url(#arw)"/>
    <line x1="1100" y1="660" x2="1100" y2="710" marker-end="url(#arw)"/>
    <line x1="1300" y1="390" x2="1300" y2="440" marker-end="url(#arw)"/>
    <line x1="1300" y1="480" x2="1300" y2="530" marker-end="url(#arw)"/>
    <line x1="1300" y1="570" x2="1300" y2="620" marker-end="url(#arw)"/>
  </g>

  <g font-size="12" fill="#000">
    <rect x="86" y="468" width="18" height="14" fill="#fff"/><text x="95" y="479" text-anchor="middle">否</text>
    <rect x="205" y="550" width="18" height="14" fill="#fff"/><text x="214" y="561" text-anchor="middle">是</text>
    <rect x="91" y="748" width="18" height="14" fill="#fff"/><text x="100" y="759" text-anchor="middle">是</text>
    <rect x="290" y="748" width="18" height="14" fill="#fff"/><text x="299" y="759" text-anchor="middle">否</text>
    <rect x="506" y="468" width="18" height="14" fill="#fff"/><text x="515" y="479" text-anchor="middle">否</text>
    <rect x="625" y="550" width="18" height="14" fill="#fff"/><text x="634" y="561" text-anchor="middle">是</text>
    <rect x="511" y="748" width="18" height="14" fill="#fff"/><text x="520" y="759" text-anchor="middle">是</text>
    <rect x="710" y="748" width="18" height="14" fill="#fff"/><text x="719" y="759" text-anchor="middle">否</text>
  </g>

  <g font-size="14" fill="#000">
    <rect x="675" y="20" width="90" height="40" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="720" y="45" text-anchor="middle">运营</text>
    <rect x="125" y="160" width="150" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="200" y="185" text-anchor="middle">云Mall管理后台</text>
    <rect x="715" y="160" width="150" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="790" y="185" text-anchor="middle">搜索管理后台</text>

    <!-- 暗纹词流 -->
    <rect x="120" y="250" width="160" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="200" y="275" text-anchor="middle">暗纹词配置页面</text>
    <rect x="120" y="342" width="160" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="200" text-anchor="middle"><tspan x="200" y="366">新增/编辑/删除</tspan><tspan x="200" y="384">暗纹词</tspan></text>
    <polygon points="200,435 290,490 200,545 110,490" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="200" text-anchor="middle"><tspan x="200" y="486">必填项校验</tspan><tspan x="200" y="504">通过?</tspan></text>
    <rect x="30" y="580" width="110" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="85" y="605" text-anchor="middle">提示错误位置</text>
    <rect x="155" y="580" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="200" y="605" text-anchor="middle">保存</text>
    <polygon points="200,670 285,720 200,770 115,720" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="200" text-anchor="middle"><tspan x="200" y="716">状态是否</tspan><tspan x="200" y="734">生效?</tspan></text>
    <rect x="50" y="810" width="130" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="115" y="835" text-anchor="middle">暗纹词生效</text>
    <rect x="220" y="810" width="130" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="285" y="835" text-anchor="middle">暗纹词失效</text>

    <!-- 搜索热词流 -->
    <rect x="540" y="250" width="160" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="620" y="275" text-anchor="middle">搜索热词配置页面</text>
    <rect x="540" y="342" width="160" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="620" text-anchor="middle"><tspan x="620" y="366">新增/编辑/删除</tspan><tspan x="620" y="384">搜索热词</tspan></text>
    <polygon points="620,435 710,490 620,545 530,490" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="620" text-anchor="middle"><tspan x="620" y="486">必填项校验</tspan><tspan x="620" y="504">通过?</tspan></text>
    <rect x="450" y="580" width="110" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="505" y="605" text-anchor="middle">提示错误位置</text>
    <rect x="575" y="580" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="620" y="605" text-anchor="middle">保存</text>
    <polygon points="620,670 705,720 620,770 535,720" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="620" text-anchor="middle"><tspan x="620" y="716">状态是否</tspan><tspan x="620" y="734">生效?</tspan></text>
    <rect x="470" y="810" width="130" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="535" y="835" text-anchor="middle">搜索热词生效</text>
    <rect x="640" y="810" width="130" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="705" y="835" text-anchor="middle">搜索热词失效</text>

    <!-- 运营后台 -->
    <rect x="1045" y="250" width="110" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1100" y="275" text-anchor="middle">运营后台页面</text>

    <!-- 黑名单 -->
    <rect x="840" y="350" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="900" y="375" text-anchor="middle">黑名单管理</text>
    <rect x="845" y="440" width="110" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="900" y="465" text-anchor="middle">选中商品</text>
    <rect x="825" y="530" width="150" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="900" y="555" text-anchor="middle">添加/移除黑名单</text>
    <rect x="855" y="620" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="900" y="645" text-anchor="middle">确定</text>
    <rect x="855" y="710" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="900" y="735" text-anchor="middle">生效</text>

    <!-- 白名单 -->
    <rect x="1040" y="350" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1100" y="375" text-anchor="middle">白名单管理</text>
    <rect x="1045" y="440" width="110" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1100" y="465" text-anchor="middle">选中商品</text>
    <rect x="1025" y="530" width="150" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1100" y="555" text-anchor="middle">添加/移除白名单</text>
    <rect x="1055" y="620" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1100" y="645" text-anchor="middle">确定</text>
    <rect x="1055" y="710" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1100" y="735" text-anchor="middle">生效</text>

    <!-- 排序 -->
    <rect x="1240" y="350" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1300" y="375" text-anchor="middle">排序管理</text>
    <rect x="1220" y="440" width="160" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1300" y="465" text-anchor="middle">拖拽商品重新排序</text>
    <rect x="1255" y="530" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1300" y="555" text-anchor="middle">保存</text>
    <rect x="1255" y="620" width="90" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1300" y="645" text-anchor="middle">生效</text>
  </g>
</svg>
